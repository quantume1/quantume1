<svg xmlns="http://www.w3.org/2000/svg" width="860" height="142" viewBox="0 0 860 142" font-family="'ProfileMono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" role="img" aria-label="The year at one character per day">
<style>@font-face{font-family:'ProfileMono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'ProfileMono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
    @keyframes rise { from { opacity:0; transform:translateY(-8px); }
                        to { opacity:1; transform:translateY(0); } }
    @keyframes grow { from { opacity:0; transform:scaleX(0); }
                        to { opacity:1; transform:scaleX(1); } }
    .chr  { animation:rise .45s ease-out backwards; }
    .bar  { animation:grow .6s ease-out backwards; transform-origin:left center; }
    </style>
<rect width="860" height="142" rx="10" fill="#0d1117" stroke="#21262d"/>
<text x="22" y="24" fill="#58a6ff" font-size="12" font-weight="700" class=" chr" style="animation-delay:0.05s">year</text>
<line x1="22" y1="34" x2="32" y2="34" stroke="#21262d"/>
<text x="22" y="56.0" fill="#7d8590" font-size="9.5" class=" chr" style="animation-delay:0.20s">10-29</text>
<text x="68" y="56.0" fill="#39d353" font-size="12.0" textLength="763.2" lengthAdjust="spacing" xml:space="preserve" class=" chr" style="animation-delay:0.24s">                                                                                                          </text>
<text x="22" y="73.0" fill="#7d8590" font-size="9.5" class=" chr" style="animation-delay:0.32s">02-12</text>
<text x="68" y="73.0" fill="#39d353" font-size="12.0" textLength="763.2" lengthAdjust="spacing" xml:space="preserve" class=" chr" style="animation-delay:0.36s">                                                                                                          </text>
<text x="22" y="90.0" fill="#7d8590" font-size="9.5" class=" chr" style="animation-delay:0.44s">05-29</text>
<text x="68" y="90.0" fill="#39d353" font-size="12.0" textLength="763.2" lengthAdjust="spacing" xml:space="preserve" class=" chr" style="animation-delay:0.48s">                                                                                                         @</text>
<text x="22" y="107.0" fill="#7d8590" font-size="9.5" class=" chr" style="animation-delay:0.56s">09-12</text>
<text x="68" y="107.0" fill="#39d353" font-size="12.0" textLength="338.4" lengthAdjust="spacing" xml:space="preserve" class=" chr" style="animation-delay:0.60s">@    s                                    +@   </text>
<text x="22" y="132" fill="#7d8590" font-size="10" class=" chr" style="animation-delay:0.68s">one character per day · densest = busiest (8 on a day)</text>
</svg>