name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"      # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # Parser check against a recorded fixture. The GraphQL API cannot be
      # reached from a dev machine behind a proxy, so this is what catches a
      # broken response shape before it reaches the graph.
      - run: python scripts/fetch_stats.py --selftest

      - name: Fetch stats
        env:
          # The built-in token is enough; no personal access token needed.
          # Add a PROFILE_TOKEN secret (a PAT with read:user) only if you want
          # private contributions counted in the totals.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/fetch_stats.py

      # Both renderers validate their own SVG and refuse to write on failure,
      # so a bad run fails loudly instead of committing a broken graphic.
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/render_cards_svg.py

      # Catches a blank-panel regression (a base rule that hides content) or a
      # malformed document before it can be committed.
      - run: python scripts/validate_svgs.py

      - name: Commit refreshed art
        run: |
          FILES="data/stats.json contrib-heatmap.svg streak.svg langs.svg year.svg"
          if git diff --quiet -- $FILES; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          # [skip ci] keeps this commit from re-triggering the push trigger.
          git commit -m "chore: refresh profile art [skip ci]"
          git push
