<svg xmlns="http://www.w3.org/2000/svg" width="425" height="168" viewBox="0 0 425 168" font-family="'ProfileMono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" role="img" aria-label="Top languages by bytes of code">
<style>@font-face{font-family:'ProfileMono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'ProfileMono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
    @keyframes rise { from { opacity:0; transform:translateY(-8px); }
                        to { opacity:1; transform:translateY(0); } }
    @keyframes grow { from { opacity:0; transform:scaleX(0); }
                        to { opacity:1; transform:scaleX(1); } }
    .chr  { animation:rise .45s ease-out backwards; }
    .bar  { animation:grow .6s ease-out backwards; transform-origin:left center; }
    </style>
<rect width="425" height="168" rx="10" fill="#0d1117" stroke="#21262d"/>
<text x="22" y="24" fill="#58a6ff" font-size="12" font-weight="700" class=" chr" style="animation-delay:0.05s">languages</text>
<line x1="22" y1="34" x2="32" y2="34" stroke="#21262d"/>
<text x="22" y="86" fill="#7d8590" font-size="11.5" class=" chr" style="animation-delay:0.20s">no language data — needs the GraphQL path</text>
<text x="22" y="104" fill="#7d8590" font-size="11.5" class=" chr" style="animation-delay:0.26s">(runs automatically in Actions)</text>
</svg>