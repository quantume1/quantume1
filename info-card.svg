<svg xmlns="http://www.w3.org/2000/svg" width="560" height="281" viewBox="0 0 560 281" font-family="'ProfileMono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" role="img" aria-label="Terminal-style profile info card">
<style>@font-face{font-family:'ProfileMono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'ProfileMono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style>
<style>
    text { font-size:13.0px; }
    .k { fill:#39d353; }
    .v { fill:#c9d1d9; }
    .d { fill:#7d8590; }
    .t { fill:#58a6ff; font-weight:600; }
    
    @keyframes in { from { opacity:0; transform:translateX(-8px); }
                      to { opacity:1; transform:translateX(0); } }
    /* backwards, so that a renderer ignoring @keyframes shows the finished
       card instead of an empty panel. See render_heatmap_svg.py. */
    .a { animation:in .42s ease-out backwards; }
    </style>
