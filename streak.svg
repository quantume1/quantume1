<svg xmlns="http://www.w3.org/2000/svg" width="425" height="168" viewBox="0 0 425 168" font-family="'ProfileMono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" role="img" aria-label="Contribution streak summary">
<style>@font-face{font-family:'ProfileMono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'ProfileMono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
    @keyframes rise { from { opacity:0; transform:translateY(-8px); }
                        to { opacity:1; transform:translateY(0); } }
    @keyframes grow { from { opacity:0; transform:scaleX(0); }
                        to { opacity:1; transform:scaleX(1); } }
    .chr  { animation:rise .45s ease-out backwards; }
    .bar  { animation:grow .6s ease-out backwards; transform-origin:left center; }
    </style>
<rect width="425" height="168" rx="10" fill="#0d1117" stroke="#21262d"/>
<text x="22" y="24" fill="#58a6ff" font-size="12" font-weight="700" class=" chr" style="animation-delay:0.05s">streak</text>
<line x1="22" y1="34" x2="32" y2="34" stroke="#21262d"/>
<text x="22" y="82" fill="#39d353" font-size="44" font-weight="700" class=" chr" style="animation-delay:0.18s">0</text>
<text x="58" y="78" fill="#7d8590" font-size="13" class=" chr" style="animation-delay:0.24s">day streak</text>
<text x="22" y="104" fill="#7d8590" font-size="11" class=" chr" style="animation-delay:0.30s">since —</text>
<line x1="22" y1="118" x2="403" y2="118" stroke="#21262d"/>
<text x="22" y="138" fill="#c9d1d9" font-size="12" class=" chr" style="animation-delay:0.38s">longest <tspan fill="#39d353">2</tspan> days</text>
<text x="22" y="155" fill="#7d8590" font-size="10.5" class=" chr" style="animation-delay:0.44s">11 Sep 2026 – 12 Sep 2026</text>
<text x="403" y="138" fill="#c9d1d9" font-size="12" text-anchor="end" class=" chr" style="animation-delay:0.50s">3 active days</text>
<text x="403" y="155" fill="#7d8590" font-size="10.5" text-anchor="end" class=" chr" style="animation-delay:0.56s">0.8% of the year</text>
</svg>